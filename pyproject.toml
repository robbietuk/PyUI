[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyui"
version = "0.1.0"
description = "A small starter Python project managed with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyui = "pyui.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
