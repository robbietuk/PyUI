[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyui"
version = "0.1.0"
description = "A small starter Python project managed with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.1",
]

[project.scripts]
pyui = "pyui.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "mypy>=1.10.0", "pre-commit>=4.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
pretty = true
disallow_untyped_defs = true
disallow_untyped_globals = true
no_implicit_optional = true
warn_unused_configs = true
